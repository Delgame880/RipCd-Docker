name: Docker image

# Builds the multi-arch image and pushes it to the GitHub container registry.
#
#   push to main / a version tag  ->  ghcr.io/<owner>/ripcd-docker
#     main                        ->  :latest  (+ :main, :sha-xxxxxxx)
#     v1.2.3                      ->  :1.2.3, :1.2, :1
#     pull request                ->  built only, nothing is pushed
#
# After the first push, make the package public in the repository's package
# settings so `docker pull` works without logging in.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner_arch: amd64
          - platform: linux/arm64
            runner_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.runner_arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runner_arch }}
          provenance: true
          sbom: true

  smoke:
    name: Smoke test the image (amd64)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Build for the local platform
        run: docker build -t ripcd:test .

      - name: Start in demo mode and ask for the health endpoint
        run: |
          docker run -d --name ripcd-test -p 18080:8080 \
            -e RIPCD_MOCK=1 -e RIPCD_MEDIA_ROOTS=/media -e RIPCD_OUTPUT_DIR=/media \
            ripcd:test
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health > health.json; then break; fi
            sleep 2
          done
          cat health.json
          python - <<'PY'
          import json
          data = json.load(open("health.json"))
          assert data["mock"] is True, data
          assert "cdparanoia" not in data["missing_tools"], "cdparanoia is missing from the image"
          assert "ffmpeg" not in data["missing_tools"], "ffmpeg is missing from the image"
          print("image is healthy:", data)
          PY

      - name: Check the UI and a simulated disc
        run: |
          curl -fsS http://127.0.0.1:18080/ | grep -qi ripcd
          curl -fsS -X POST http://127.0.0.1:18080/api/mock/insert \
            -H 'content-type: application/json' -d '{"disc":"short-ep"}'
          curl -fsS http://127.0.0.1:18080/api/disc | python -c "import json,sys; d=json.load(sys.stdin); assert d['has_disc'] and d['kind'] in {'audio','mixed'}, d; print('disc detected:', d['toc']['total_time'])"

      - name: Container logs
        if: always()
        run: docker logs ripcd-test || true
