name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install ffmpeg and cdparanoia
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg cdparanoia

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-dev.txt

      - name: Run the test suite
        working-directory: app
        env:
          # the tests never touch a real drive: demo mode simulates the discs
          RIPCD_MOCK: "1"
        run: pytest -q

  compose:
    name: Validate compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docker-compose.yml
        run: |
          python - <<'PY'
          import sys, yaml
          data = yaml.safe_load(open("docker-compose.yml"))
          service = data["services"]["ripcd"]
          assert "devices" in service, "the CD drive must be passed through"
          assert any("/dev/sg" in d for d in service["devices"]), "the SCSI generic device is missing"
          assert "x-casaos" in data, "ZimaOS metadata is missing"
          assert data["x-casaos"]["port_map"] and data["x-casaos"]["main"] == "ripcd"
          print("docker-compose.yml looks good")
          PY
        # pyyaml ships with the runner image

  dockerfile:
    name: Dockerfile lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
